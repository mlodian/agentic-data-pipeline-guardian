# Production-style run: ingest a new batch, let the Guardian agent check it
# and (if ANTHROPIC_API_KEY is configured as a repo secret) reason about any
# findings with Claude and open a GitHub issue for anything CRITICAL, then
# transform it. Without that secret it still runs end to end using the
# deterministic fallback in agent/guardian_agent.py -- this workflow never
# hard-fails just because the key isn't set yet.
#
# Two ordering decisions matter here:
#
# * The Guardian runs BEFORE dbt, against the raw layer. dbt build exits
#   non-zero on exactly the data the Guardian exists to catch, and a failed
#   step skips every step after it -- so with dbt first, the monitor never
#   ran on a bad batch. Checking first also means any quarantine happens
#   before the marts consume the rows.
# * The warehouse file is restored from and saved to the Actions cache, so
#   run history (trend, z-score volume check, degradation) accumulates
#   across runs instead of starting empty on every fresh runner. It is saved
#   with `if: always()` so a failing dbt build doesn't discard the run that
#   most needs recording. Caches unused for 7 days are evicted, which resets
#   history -- a real deployment would keep it in the warehouse proper.
#
# Triggered on demand (Actions tab -> Run workflow) rather than on a cron.
# An hourly schedule is a one-line change (add `schedule: - cron: "0 * * *
# *"` back under `on:`) if you want it running continuously against a real
# upstream cadence -- just know every run that has ANTHROPIC_API_KEY set
# costs a small amount of API usage.
name: Guardian scheduled run

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# History is a single DuckDB file; two overlapping runs would each restore
# the same snapshot and the later save would drop the earlier run.
concurrency:
  group: guardian-history
  cancel-in-progress: false

jobs:
  guardian:
    runs-on: ubuntu-latest
    env:
      GUARDIAN_DB_PATH: ${{ github.workspace }}/data/guardian.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore warehouse + run history
        uses: actions/cache/restore@v4
        with:
          path: data/guardian.duckdb
          key: guardian-db-${{ github.run_id }}
          restore-keys: guardian-db-

      - name: Ingest latest batch
        run: python -m ingestion.generate --seed ${{ github.run_number }}

      - name: Run the Guardian agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_OPEN_GH_ISSUES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.guardian_agent

      - name: dbt build (deps, run, test)
        working-directory: dbt_project
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt build

      - name: Save warehouse + run history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/guardian.duckdb
          key: guardian-db-${{ github.run_id }}

      - name: Upload incident report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report-${{ github.run_number }}
          path: docs/incident_reports/*.md
          if-no-files-found: ignore
