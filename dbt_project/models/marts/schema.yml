version: 2

models:
  - name: dim_customers
    description: One row per customer, the conformed dimension used across marts.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]

  - name: fct_deals
    description: One row per CRM deal, joined to its customer.
    columns:
      - name: deal_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: amount
        data_tests: [not_null]

  - name: fct_invoices
    description: One row per ERP invoice, raised against a closed-won deal.
    columns:
      - name: invoice_id
        data_tests: [not_null, unique]
      - name: deal_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_deals')
              field: deal_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: customer_revenue_summary
    description: >
      One row per customer combining CRM pipeline and ERP billing. The
      downstream model with the widest blast radius in this project -- it
      depends on all three upstream marts.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: booked_revenue
        data_tests: [not_null]
      - name: invoiced_revenue
        data_tests: [not_null]
